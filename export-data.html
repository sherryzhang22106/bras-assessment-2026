<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导出测评数据</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #718096;
            margin-bottom: 40px;
            font-size: 16px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 800;
        }
        
        .buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 200px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #f7fafc;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #718096;
        }
        
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .data-list {
            margin-top: 40px;
        }
        
        .data-item {
            background: #f7fafc;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            border-left: 4px solid #667eea;
        }
        
        .data-item h3 {
            color: #1a202c;
            margin-bottom: 12px;
            font-size: 18px;
        }
        
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .data-row:last-child {
            border-bottom: none;
        }
        
        .data-label {
            color: #718096;
            font-weight: 600;
        }
        
        .data-value {
            color: #1a202c;
        }
        
        .report-content {
            display: none;
        }
        
        .pdf-page {
            background: white;
            padding: 40px;
            margin-bottom: 20px;
        }
        
        .pdf-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        
        .pdf-section {
            margin-bottom: 30px;
        }
        
        .pdf-section h2 {
            color: #667eea;
            margin-bottom: 16px;
            font-size: 20px;
        }
        
        .score-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-weight: bold;
            margin: 0 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 测评数据导出</h1>
        <p class="subtitle">导出所有测评数据和AI报告</p>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">测评总数</div>
                <div class="stat-value" id="totalCount">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">平均分数</div>
                <div class="stat-value" id="avgScore">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">最新测评</div>
                <div class="stat-value" id="latestDate">-</div>
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn-primary" onclick="exportAllPDF()">
                📄 导出所有报告为PDF
            </button>
            <button class="btn-secondary" onclick="exportJSON()">
                💾 导出JSON数据
            </button>
            <button class="btn-secondary" onclick="loadData()">
                🔄 刷新数据
            </button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在加载数据...</p>
        </div>
        
        <div class="data-list" id="dataList"></div>
        
        <!-- PDF内容模板 -->
        <div class="report-content" id="reportContent"></div>
    </div>
    
    <script>
        let assessmentsData = [];
        
        // 页面加载时自动获取数据
        window.onload = () => {
            loadData();
        };
        
        async function loadData() {
            const loading = document.getElementById('loading');
            const dataList = document.getElementById('dataList');
            
            loading.style.display = 'block';
            dataList.innerHTML = '';
            
            try {
                const response = await fetch('http://localhost:3001/api/export-all-assessments');
                const result = await response.json();
                
                assessmentsData = result.data;
                
                // 更新统计
                document.getElementById('totalCount').textContent = result.count;
                
                if (result.count > 0) {
                    const avgScore = result.data.reduce((sum, item) => sum + item.scores.standardized, 0) / result.count;
                    document.getElementById('avgScore').textContent = Math.round(avgScore);
                    
                    const latestDate = new Date(result.data[0].createdAt);
                    document.getElementById('latestDate').textContent = 
                        `${latestDate.getMonth() + 1}/${latestDate.getDate()}`;
                    
                    // 显示数据列表
                    result.data.forEach((item, index) => {
                        const div = document.createElement('div');
                        div.className = 'data-item';
                        div.innerHTML = `
                            <h3>测评 #${index + 1}</h3>
                            <div class="data-row">
                                <span class="data-label">测评时间</span>
                                <span class="data-value">${new Date(item.createdAt).toLocaleString('zh-CN')}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">总分</span>
                                <span class="data-value">${item.scores.standardized} 分</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">等级</span>
                                <span class="data-value">${item.scores.grade} 级 (${item.scores.probability})</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">对方态度</span>
                                <span class="data-value">${item.scores.attitudeLevel}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">核心原因</span>
                                <span class="data-value">${item.scores.reasonType}</span>
                            </div>
                            <div class="data-row">
                                <span class="data-label">AI报告</span>
                                <span class="data-value">${item.aiReport ? '✅ 已生成' : '❌ 未生成'}</span>
                            </div>
                        `;
                        dataList.appendChild(div);
                    });
                } else {
                    dataList.innerHTML = '<p style="text-align:center;color:#718096;padding:40px;">暂无测评数据</p>';
                }
                
            } catch (error) {
                console.error('加载数据失败:', error);
                dataList.innerHTML = '<p style="text-align:center;color:#ef4444;padding:40px;">加载失败，请确保后端服务运行在 http://localhost:3001</p>';
            } finally {
                loading.style.display = 'none';
            }
        }
        
        function exportJSON() {
            if (assessmentsData.length === 0) {
                alert('没有数据可导出');
                return;
            }
            
            const dataStr = JSON.stringify(assessmentsData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `测评数据_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert('JSON数据已导出！');
        }
        
        async function exportAllPDF() {
            if (assessmentsData.length === 0) {
                alert('没有数据可导出');
                return;
            }
            
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            loading.querySelector('p').textContent = '正在生成PDF，请稍候...';
            
            try {
                for (let i = 0; i < assessmentsData.length; i++) {
                    const item = assessmentsData[i];
                    loading.querySelector('p').textContent = `正在生成第 ${i + 1}/${assessmentsData.length} 份报告...`;
                    
                    await generateSinglePDF(item, i + 1);
                    
                    // 延迟以避免浏览器阻塞
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }
                
                alert('所有PDF报告已导出完成！');
            } catch (error) {
                console.error('导出PDF失败:', error);
                alert('导出失败: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        }
        
        async function generateSinglePDF(item, index) {
            const reportContent = document.getElementById('reportContent');
            
            // 生成PDF内容
            reportContent.innerHTML = `
                <div class="pdf-page">
                    <div class="pdf-header">
                        <h1>分手挽回可能性测评报告</h1>
                        <p style="color:#718096;margin-top:12px;">测评编号：#${index} | ${new Date(item.createdAt).toLocaleString('zh-CN')}</p>
                    </div>
                    
                    <div class="pdf-section">
                        <h2>📊 评估结果</h2>
                        <p><strong>总分：</strong><span class="score-badge">${item.scores.standardized} 分</span></p>
                        <p><strong>等级：</strong>${item.scores.grade} 级</p>
                        <p><strong>挽回成功率：</strong>${item.scores.probability}</p>
                        <p><strong>对方当前态度：</strong>${item.scores.attitudeLevel}</p>
                        <p><strong>核心分手原因：</strong>${item.scores.reasonType}</p>
                    </div>
                    
                    <div class="pdf-section">
                        <h2>📈 五大维度得分</h2>
                        <p><strong>关系基础：</strong>${item.scores.sections.base.toFixed(1)} / 22</p>
                        <p><strong>分手原因：</strong>${item.scores.sections.reason.toFixed(1)} / 24</p>
                        <p><strong>当前状态：</strong>${item.scores.sections.status.toFixed(1)} / 25</p>
                        <p><strong>挽回条件：</strong>${item.scores.sections.conditions.toFixed(1)} / 27</p>
                        <p><strong>深度评估：</strong>${item.scores.sections.deep.toFixed(1)} / 7.5</p>
                    </div>
                    
                    ${item.aiReport ? `
                    <div class="pdf-section">
                        <h2>🤖 AI 深度分析报告</h2>
                        <div style="white-space: pre-wrap; line-height: 1.8; color: #1a202c;">
                            ${item.aiReport}
                        </div>
                    </div>
                    ` : '<p style="color:#ef4444;">AI报告未生成</p>'}
                </div>
            `;
            
            reportContent.style.display = 'block';
            
            const opt = {
                margin: 10,
                filename: `测评报告_${index}_${item.scores.standardized}分.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            await html2pdf().set(opt).from(reportContent).save();
            
            reportContent.style.display = 'none';
        }
    </script>
</body>
</html>
